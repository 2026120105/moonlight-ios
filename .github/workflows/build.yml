name: Build TrollStore IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: 🚀 Force Fetch Deep Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          
      - name: 📦 Download Required Dependencies
        run: |
          chmod +x ./scripts/download-dependencies.sh
          ./scripts/download-dependencies.sh
          
      - name: 🔨 Build Moonlight Unsigned
        run: |
          # 核心修复点：
          # 1. 把 archive 换成 build，彻底绕过 testing 测试模块
          # 2. 加入 -sdk iphoneos，强制只编译实体真机架构，打死不去碰模拟器
          # 3. 指定独立输出目录 build_output，屏蔽索引器
          xcodebuild build \
            -workspace Moonlight.xcworkspace \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # 手工提取底层编译好的 .app 真实程序，并包装为巨魔 IPA
          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/Moonlight.app Payload/
          zip -r Moonlight.ipa Payload
          
      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-M2-Tracker
          path: Moonlight.ipa
