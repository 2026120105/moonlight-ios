name: Build TrollStore IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true # 仍然让它尽力拉取一次
          
      - name: 🚨 物理手术：暴力补全丢失的子模块文件
        run: |
          # 1. 补齐 X1Kit 缺失的 swift 文件
          mkdir -p X1Kit/Sources/X1Kit
          curl -sL https://raw.githubusercontent.com/moonlight-stream/X1Kit/master/Sources/X1Kit/X1Kit.swift -o X1Kit/Sources/X1Kit/X1Kit.swift
          
          # 2. 补齐 moonlight-common-c 里的三个底层 C 文件
          mkdir -p moonlight-common/moonlight-common-c/enet
          curl -sL https://raw.githubusercontent.com/moonlight-stream/moonlight-common-c/master/enet/win32.c -o moonlight-common/moonlight-common-c/enet/win32.c
          curl -sL https://raw.githubusercontent.com/moonlight-stream/moonlight-common-c/master/enet/unix.c -o moonlight-common/moonlight-common-c/enet/unix.c
          
          mkdir -p moonlight-common/moonlight-common-c/reedsolomon
          curl -sL https://raw.githubusercontent.com/moonlight-stream/moonlight-common-c/master/reedsolomon/rs.c -o moonlight-common/moonlight-common-c/reedsolomon/rs.c

          echo "✅ 丢失文件已被强行注入完毕！"
          
      - name: 📦 下载 FFmpeg 核心视频依赖库
        run: |
          chmod +x ./scripts/download-dependencies.sh
          ./scripts/download-dependencies.sh
          
      - name: 🔨 Build Moonlight Unsigned (iOS 物理真机模式)
        run: |
          xcodebuild build \
            -workspace Moonlight.xcworkspace \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # 提取并打包
          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/Moonlight.app Payload/
          zip -r Moonlight.ipa Payload
          
      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-M2-Tracker
          path: Moonlight.ipa
