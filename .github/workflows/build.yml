name: Build TrollStore IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 📥 1. 拉取官方满血源码 (彻底解决依赖黑洞)
        uses: actions/checkout@v4
        with:
          repository: moonlight-stream/moonlight-ios
          submodules: recursive
          
      - name: 📥 2. 悄悄拉取你 Fork 的魔改仓库备用
        uses: actions/checkout@v4
        with:
          path: my_fork_temp
          submodules: false
          
      - name: 💉 3. 瞬间打补丁：植入 M2 雷达代码
        run: |
          cp my_fork_temp/Limelight/Stream/VideoDecoderRenderer.m Limelight/Stream/VideoDecoderRenderer.m
          echo "✅ M2 旁路雷达代码植入完成！"
          
      - name: 🔨 4. 启动物理真机无情编译
        run: |
          # 🚨 终极修复：使用原生的 -project 替代 -workspace！
          xcodebuild build \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
      - name: 📦 5. 提取纯净 APP 并打包为巨魔 IPA
        run: |
          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/Moonlight.app Payload/
          zip -r Moonlight.ipa Payload
          
      - name: 📤 6. 上传最终成品
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-M2-Tracker
          path: Moonlight.ipa
