name: Build TrollStore IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 📥 步骤1：拉取你的仓库 (提取魔改文件)
        uses: actions/checkout@v4
        with:
          path: my_fork
          
      - name: 📥 步骤2：拉取官方满血原版仓库 (完美解决依赖报错)
        uses: actions/checkout@v4
        with:
          repository: moonlight-stream/moonlight-ios
          submodules: recursive
          path: official
          
      - name: 💉 步骤3：暗影雷达核心植入 (偷梁换柱)
        run: |
          # 提取你修改的雷达文件，直接覆盖掉官方的对应文件！
          cp my_fork/Limelight/Stream/VideoDecoderRenderer.m official/Limelight/Stream/VideoDecoderRenderer.m
          echo "✅ 成功将 M2 硬件解码雷达注入官方源码！"
          
      - name: 📦 步骤4：下载核心视频硬件解码库
        run: |
          cd official
          chmod +x ./scripts/download-dependencies.sh
          ./scripts/download-dependencies.sh
          
      - name: 🔨 步骤5：启动物理真机无情编译
        run: |
          cd official
          # 强制锁定 -sdk iphoneos，彻底掐死 Xcode 乱扫模拟器代码的 Bug
          xcodebuild build \
            -workspace Moonlight.xcworkspace \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # 手工提取底层纯净 APP 并打包为巨魔 IPA
          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/Moonlight.app Payload/
          zip -r ../Moonlight.ipa Payload
          
      - name: 📤 步骤6：上传最终成品
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-M2-Tracker
          path: Moonlight.ipa
